<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0B0F1C">
  <title>HiloCoin</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <!-- Splash -->
  <div id="splash">
    <img src="logo.svg" class="splash-coin" alt="">
    <div class="splash-title">HiloCoin</div>
    <div class="loader"></div>
  </div>

  <!-- Full-screen state (open in Telegram / banned / maintenance / error) -->
  <div id="screen" class="screen" hidden></div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="me" id="me"></div>
      <button class="lang-btn" id="lang-btn" aria-label="Language"></button>
    </header>

    <main id="main">
      <section class="tab active" id="tab-home"></section>
      <section class="tab" id="tab-tasks"></section>
      <section class="tab" id="tab-friends"></section>
      <section class="tab" id="tab-top"></section>
      <section class="tab" id="tab-wallet"></section>
    </main>

    <nav class="nav" id="nav">
      <button class="nav-btn active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="nav_home"></span>
      </button>
      <button class="nav-btn" data-tab="tasks">
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
        <span data-i18n="nav_tasks"></span>
        <i class="dot" id="tasks-dot" hidden></i>
      </button>
      <button class="nav-btn" data-tab="friends">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/><path d="M16 4a4 4 0 0 1 0 8"/><path d="M22 21v-1a6 6 0 0 0-4-5.6"/></svg>
        <span data-i18n="nav_friends"></span>
      </button>
      <button class="nav-btn" data-tab="top">
        <svg viewBox="0 0 24 24"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <span data-i18n="nav_top"></span>
      </button>
      <button class="nav-btn" data-tab="wallet">
        <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v2"/><path d="M3 7v11a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H5a2 2 0 0 1-2-2"/><circle cx="16.5" cy="14" r="1.2"/></svg>
        <span data-i18n="nav_wallet"></span>
      </button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
