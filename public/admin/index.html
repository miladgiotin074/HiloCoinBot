<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>پنل مدیریت HiloCoin</title>
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <!-- Login -->
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="../logo.svg" width="64" height="64" alt="">
      <h1>پنل مدیریت HiloCoin</h1>
      <p>برای ورود رمز عبور مدیریت را وارد کنید</p>
      <input class="input" type="password" id="login-pass" placeholder="رمز عبور" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">ورود</button>
      <div class="login-err" id="login-err"></div>
    </form>
  </div>

  <!-- Panel -->
  <div id="panel" class="layout" hidden>
    <aside class="side">
      <div class="brand"><img src="../logo.svg" width="34" height="34" alt=""><div><b>HiloCoin</b><small>پنل مدیریت</small></div></div>
      <nav class="menu" id="menu">
        <button data-view="dashboard" class="on"><span>📊</span>داشبورد</button>
        <button data-view="users"><span>👥</span>کاربران</button>
        <button data-view="tasks"><span>✅</span>تسک‌ها</button>
        <button data-view="settings"><span>⚙️</span>تنظیمات</button>
        <button data-view="broadcast"><span>📣</span>پیام همگانی</button>
      </nav>
      <button class="logout" id="logout">↩︎ خروج</button>
    </aside>
    <main class="content" id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast"></div>
  <script src="admin.js"></script>
</body>
</html>
